[package]
name = "soundz"
description = "SoundZ desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "soundz"

[lints]
workspace = true

[features]
# ASIO audio devices on Windows (see soundz-playback's `asio` feature).
asio = ["soundz-playback/asio"]

[dependencies]
soundz-engine.workspace = true
soundz-audio-io.workspace = true
soundz-ui-egui.workspace = true
soundz-playback.workspace = true
soundz-automation.workspace = true
clap.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links", "clipboard"] }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde_json.workspace = true
log.workspace = true
chrono.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "linux"))))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Preserve X11 fallback while enabling font-free Wayland client-side controls.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland-csd-adwaita-notitle"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[build-dependencies]
# Icon + VERSIONINFO for soundz.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }

[target.'cfg(windows)'.dependencies]
craft-update = { workspace = true }
