soundz-au-host.workspace = true
soundz-model.workspace = true
soundz-mix.workspace = true
soundz-engine.workspace = true
soundz-playback.workspace = true
soundz-video.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[lints]
workspace = true

[build-dependencies]
